services:
  db:
    image: postgres:17-alpine
    container_name: saunavuoro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: saunavuoro
      POSTGRES_USER: saunavuoro
      POSTGRES_PASSWORD: saunavuoro
    ports:
      - "5434:5432"
    volumes:
      - saunavuoro-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saunavuoro -d saunavuoro"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  saunavuoro-db-data:
